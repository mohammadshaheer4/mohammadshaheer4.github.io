<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Gluon W cryptocurrency stabilization</title>
  <desc id="desc">A volatile asset can be split into stable and unstable components through fission and merged back through fusion.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#221d49" />
      <stop offset="1" stop-color="#133d51" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c4b5fd" />
    </marker>
  </defs>
  <rect width="640" height="400" rx="22" fill="url(#bg)" />
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="58" font-size="29" font-weight="700" fill="#f5f3ff">Gluon W</text>
    <text x="320" y="88" font-size="18" fill="#c4b5fd">Cryptocurrency stabilization</text>
    <g fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 230 204 C 315 204 300 155 393 155" />
      <path d="M 230 225 C 315 225 300 272 393 272" />
    </g>
    <text x="310" y="135" font-size="16" fill="#ddd6fe">Fission</text>
    <circle cx="156" cy="215" r="68" fill="#4c387b" stroke="#c4b5fd" stroke-width="2" />
    <path d="M 117 206 L 131 189 L 145 218 L 161 196 L 179 228 L 193 207" fill="none" stroke="#ddd6fe" stroke-width="4" stroke-linejoin="round" />
    <text x="156" y="249" font-size="19" font-weight="700" fill="#f5f3ff">Volatile asset</text>
    <rect x="399" y="116" width="200" height="84" rx="17" fill="#145a59" stroke="#5eead4" stroke-width="2" />
    <path d="M 421 149 H 444" stroke="#5eead4" stroke-width="4" stroke-linecap="round" />
    <text x="506" y="151" font-size="21" font-weight="700" fill="#ccfbf1">Stable</text>
    <text x="499" y="178" font-size="16" fill="#a6e5dd">component</text>
    <rect x="399" y="231" width="200" height="84" rx="17" fill="#623a42" stroke="#fda4af" stroke-width="2" />
    <path d="M 418 269 L 426 259 L 434 280 L 443 265" fill="none" stroke="#fda4af" stroke-width="3" />
    <text x="513" y="266" font-size="21" font-weight="700" fill="#ffe4e6">Unstable</text>
    <text x="499" y="293" font-size="16" fill="#fecdd3">component</text>
    <path d="M 441 327 C 359 370 248 363 183 298" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <text x="320" y="381" font-size="16" fill="#ddd6fe">Fusion recombines the components</text>
  </g>
</svg>
