<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain oracles formally verified in Coq</title>
  <desc id="desc">External data flows through an oracle to smart contracts. A Coq model verifies properties of the oracle's behavior.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10283f" />
      <stop offset="1" stop-color="#173f50" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7dd3fc" />
    </marker>
  </defs>
  <rect width="640" height="400" rx="22" fill="url(#bg)" />
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="57" font-size="25" font-weight="700" fill="#f0f9ff">Verified blockchain oracles</text>
    <g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 179 169 H 240" />
      <path d="M 394 169 H 455" />
    </g>
    <rect x="36" y="111" width="143" height="116" rx="16" fill="#1f4660" stroke="#5687a1" />
    <g fill="none" stroke="#7dd3fc" stroke-width="3">
      <ellipse cx="107" cy="139" rx="25" ry="9" />
      <path d="M 82 139 V 165 C 82 177 132 177 132 165 V 139 M 82 151 C 82 163 132 163 132 151" />
    </g>
    <text x="107" y="203" font-size="18" fill="#e0f2fe">External data</text>
    <rect x="246" y="111" width="148" height="116" rx="16" fill="#0e7490" stroke="#67e8f9" stroke-width="2" />
    <path d="M 299 151 L 320 130 L 341 151 L 320 172 Z" fill="none" stroke="#cffafe" stroke-width="3" />
    <text x="320" y="203" font-size="21" font-weight="700" fill="#ecfeff">Oracle</text>
    <rect x="461" y="111" width="143" height="116" rx="16" fill="#1f4660" stroke="#5687a1" />
    <path d="M 509 132 H 553 V 169 H 509 Z M 519 144 H 543 M 519 156 H 539" fill="none" stroke="#7dd3fc" stroke-width="3" />
    <text x="532" y="203" font-size="17" fill="#e0f2fe">Smart contracts</text>
    <path d="M 320 227 V 265" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="5 5" />
    <rect x="174" y="268" width="292" height="76" rx="14" fill="#123e43" stroke="#5eead4" />
    <path d="M 200 304 L 210 314 L 228 292" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="339" y="300" font-size="20" font-weight="700" fill="#ccfbf1">Coq formal model</text>
    <text x="339" y="327" font-size="16" fill="#99ddd4">Trace-level proofs</text>
  </g>
</svg>
